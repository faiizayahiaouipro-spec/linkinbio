<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omar Yahiaoui - RTI Algérie</title>
<style>
  :root {
    --overlay: rgba(6, 8, 10, 0.72);
    --text: #f5f6f7;
    --text-muted: #b9bec4;
    --call-color: #ff8a3d;
    --whatsapp-color: #ffd23d;
    --email-color: #3ddc84;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
  }

  .overlay {
    width: 100%;
    min-height: 100vh;
    background: var(--overlay);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }

  .page {
    width: 100%;
    max-width: 400px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    height: 40px;
    align-self: flex-end;
    margin-bottom: 40px;
  }

  .avatar {
    width: 140px;
    height: 175px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.85);
    margin-bottom: 20px;
  }

  .name {
    color: var(--text);
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .title {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0 0 36px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .link-card {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 999px;
    background: rgba(20, 22, 26, 0.55);
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    border: 1.5px solid var(--card-color);
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .link-card:hover {
    background: rgba(20, 22, 26, 0.8);
  }

  .link-card:active {
    transform: scale(0.98);
  }

  .call    { --card-color: rgba(230, 200, 150, 0.55); }
  .whatsapp{ --card-color: rgba(230, 200, 150, 0.55); }
  .email   { --card-color: rgba(200, 205, 210, 0.4); }

  .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  footer {
    margin-top: 44px;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="overlay">
  <div class="page">

    <img class="logo" src="logo.png" alt="RTI Algérie">

    <img class="avatar" src="photo.jpg" alt="Omar Yahiaoui">

    <h1 class="name">Omar Yahiaoui</h1>
    <p class="title">Account Sales Manager</p>

    <div class="links">

      <a class="link-card call" href="tel:+213661907510">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        </svg>
        +213661907510
      </a>

      <a class="link-card whatsapp" href="https://wa.me/213770907505" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        +213770907505
      </a>

      <a class="link-card email" href="mailto:omar_yahiaoui@rtialgerie.com">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Send an Email
      </a>

    </div>

    <footer>&copy; 2026 Omar Yahiaoui &middot; RTI Algérie</footer>

  </div>
</div>

</body>
</html>
